name: Generate RS Ratings

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

jobs:
  generate-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Dependencies ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify yfinance + curl_cffi
        run: |
          python -c "import yfinance; print('yfinance', yfinance.__version__)"
          python -c "import curl_cffi; print('curl_cffi OK')"

      # ── 4. Run RS calculation ───────────────────────────────────────────────
      - name: Run relative strength calculation
        run: python relative-strength.py true

      # ── 5. Commit ticker_info cache + output CSVs in-repo ──────────────────
      - name: Commit and push results
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data_persist/ticker_info.json output/
          git diff --staged --quiet || git commit -m "RS Ratings update $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
